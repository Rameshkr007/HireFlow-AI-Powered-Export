services:
  # ── Backend API Web Service ──────────────────────────────────────────
  - type: web
    name: hireflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hireflow-frontend.onrender.com
      - key: GMAIL_MODE
        value: demo
      - key: AI_PROVIDER
        value: openai
      - key: PYTHON_VERSION
        value: 3.11.9

  # ── Frontend React Static Site ────────────────────────────────────────
  - type: web
    name: hireflow-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hireflow-backend
          property: host

databases:
  - name: hireflow-postgres
    plan: free
    region: oregon
    databaseName: hireflow
    user: hireflow_user
